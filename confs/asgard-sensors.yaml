globals:
  - id: gl_temp_feed
    type: float
    initial_value: 'NAN'
  - id: gl_ow_temp_return
    type: float
    initial_value: 'NAN'
  - id: gl_temp_z1
    type: float
    initial_value: 'NAN'
  - id: gl_temp_z2
    type: float
    initial_value: 'NAN'

  - id: idx_feed
    type: int
    restore_value: true
    initial_value: '0'
  - id: idx_return
    type: int
    restore_value: true
    initial_value: '0'
  - id: idx_z1
    type: int
    restore_value: true
    initial_value: '0'
  - id: idx_z2
    type: int
    restore_value: true
    initial_value: '0'

one_wire:
  - platform: gpio
    pin: GPIO02
    id: dallas_bus

sensor:
  - platform: internal_temperature
    name: ${internal_esp_temperature}
    entity_category: diagnostic
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1

# dallas temp sensors
  - platform: dallas_temp
    index: 0
    id: ow_raw_0
    name: "DS18x20 Sensor 0"
    update_interval: 5s
    resolution: 12
    filters:
      - offset: !lambda |-
          // The offset number restores on setup; a NAN offset would blank the probe.
          return isnan(id(ow_off_0).state) ? 0.0f : id(ow_off_0).state;

  - platform: dallas_temp
    index: 1
    id: ow_raw_1
    name: "DS18x20 Sensor 1"
    update_interval: 5s
    resolution: 12
    filters:
      - offset: !lambda |-
          return isnan(id(ow_off_1).state) ? 0.0f : id(ow_off_1).state;

  - platform: dallas_temp
    index: 2
    id: ow_raw_2
    name: "DS18x20 Sensor 2"
    update_interval: 5s
    resolution: 12
    filters:
      - offset: !lambda |-
          return isnan(id(ow_off_2).state) ? 0.0f : id(ow_off_2).state;

  - platform: dallas_temp
    index: 3
    id: ow_raw_3
    name: "DS18x20 Sensor 3"
    update_interval: 5s
    resolution: 12
    filters:
      - offset: !lambda |-
          return isnan(id(ow_off_3).state) ? 0.0f : id(ow_off_3).state;

  - platform: template
    name: "DS18x20 Feed temp"
    id: ow_temp_feed
    unit_of_measurement: "°C"
    state_class: measurement
    device_class: temperature
    accuracy_decimals: 1
    update_interval: 3s  
    lambda: |-
      int idx = id(idx_feed);
      if (idx == 1) return id(ow_raw_0).state;
      if (idx == 2) return id(ow_raw_1).state;
      if (idx == 3) return id(ow_raw_2).state;
      if (idx == 4) return id(ow_raw_3).state;
      return NAN;
    on_value:
      then:
        - globals.set:
            id: gl_temp_feed
            value: !lambda 'return x;'

  - platform: template
    name: "DS18x20 Return Temp"
    id: ow_temp_return
    unit_of_measurement: "°C"
    state_class: measurement
    device_class: temperature
    accuracy_decimals: 1
    update_interval: 3s
    lambda: |-
      int idx = id(idx_return);
      if (idx == 1) return id(ow_raw_0).state;
      if (idx == 2) return id(ow_raw_1).state;
      if (idx == 3) return id(ow_raw_2).state;
      if (idx == 4) return id(ow_raw_3).state;
      return NAN;
    on_value:
      then:
        - globals.set:
            id: gl_ow_temp_return
            value: !lambda 'return x;'

  - platform: template
    name: "DS18x20 Virtual Thermostat input z1"
    id: ow_temp_z1
    unit_of_measurement: "°C"
    state_class: measurement
    device_class: temperature
    accuracy_decimals: 1
    update_interval: 3s
    lambda: |-
      int idx = id(idx_z1);
      if (idx == 1) return id(ow_raw_0).state;
      if (idx == 2) return id(ow_raw_1).state;
      if (idx == 3) return id(ow_raw_2).state;
      if (idx == 4) return id(ow_raw_3).state;
      return NAN;
    on_value:
      then:
        - globals.set:
            id: gl_temp_z1
            value: !lambda 'return x;'

  - platform: template
    name: "DS18x20 Virtual Thermostat input z2"
    id: ow_temp_z2
    unit_of_measurement: "°C"
    state_class: measurement
    device_class: temperature
    accuracy_decimals: 1
    update_interval: 3s
    lambda: |-
      int idx = id(idx_z2);
      if (idx == 1) return id(ow_raw_0).state;
      if (idx == 2) return id(ow_raw_1).state;
      if (idx == 3) return id(ow_raw_2).state;
      if (idx == 4) return id(ow_raw_3).state;
      return NAN;
    on_value:
      then:
        - globals.set:
            id: gl_temp_z2
            value: !lambda 'return x;'

  # --- DELTA T ---
  - platform: template
    id: DS18x20_delta_t
    name: "DS18x20 Delta T"
    lambda: |-
      if (isnan(id(ow_temp_feed).state) || isnan(id(ow_temp_return).state)) return NAN;
      return id(ow_temp_feed).state - id(ow_temp_return).state;
    accuracy_decimals: 1
    unit_of_measurement: "°C"
    state_class: measurement
    device_class: temperature
    update_interval: 3s

# --- CALIBRATION OFFSETS ---
# One offset per physical probe, applied on the probe's own sensor: whichever role
# the selects below give it (feed, return, zone 1, zone 2) the correction travels
# with it, and Delta T and every thermostat input follow from these numbers. The
# raw "DS18x20 Sensor N" entity shows the corrected value too, so what HA displays
# is what everything else in this file uses. Applied on the next probe read (5 s).
number:
  - platform: template
    id: ow_off_0
    name: "DS18x20 Sensor 0 Offset"
    unit_of_measurement: "°C"
    entity_category: config
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0.0
    min_value: -10.0
    max_value: 10.0
    step: 0.1

  - platform: template
    id: ow_off_1
    name: "DS18x20 Sensor 1 Offset"
    unit_of_measurement: "°C"
    entity_category: config
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0.0
    min_value: -10.0
    max_value: 10.0
    step: 0.1

  - platform: template
    id: ow_off_2
    name: "DS18x20 Sensor 2 Offset"
    unit_of_measurement: "°C"
    entity_category: config
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0.0
    min_value: -10.0
    max_value: 10.0
    step: 0.1

  - platform: template
    id: ow_off_3
    name: "DS18x20 Sensor 3 Offset"
    unit_of_measurement: "°C"
    entity_category: config
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0.0
    min_value: -10.0
    max_value: 10.0
    step: 0.1

select:  
  # --- FEED SELECT ---
  - platform: template
    name: "DS18x20 Select Feed Sensor"
    id: ow_sel_feed
    optimistic: true
    restore_value: true
    entity_category: config
    options: ["None", "DS18x20 - 0", "DS18x20 - 1", "DS18x20 - 2", "DS18x20 - 3"]
    set_action:
      - lambda: |-
          int new_idx = id(ow_sel_feed).index_of(x).value_or(0);
          id(idx_feed) = new_idx;

          if (new_idx == 0) return;

          if (id(idx_return) == new_idx) { 
            id(idx_return) = 0; 
            id(ow_sel_return).publish_state("None"); 
          }
          if (id(idx_z1) == new_idx) { 
            id(idx_z1) = 0; 
            id(ow_sel_z1).publish_state("None"); 
          }
          if (id(idx_z2) == new_idx) { 
            id(idx_z2) = 0; 
            id(ow_sel_z2).publish_state("None"); 
          }

  # --- RETURN SELECT ---
  - platform: template
    name: "DS18x20 Select Return Sensor"
    id: ow_sel_return
    optimistic: true
    restore_value: true
    entity_category: config
    options: ["None", "DS18x20 - 0", "DS18x20 - 1", "DS18x20 - 2", "DS18x20 - 3"]
    set_action:
      - lambda: |-
          int new_idx = id(ow_sel_return).index_of(x).value_or(0);
          id(idx_return) = new_idx;

          if (new_idx == 0) return;

          if (id(idx_feed) == new_idx) { 
            id(idx_feed) = 0; 
            id(ow_sel_feed).publish_state("None"); 
          }
          if (id(idx_z1) == new_idx) { 
            id(idx_z1) = 0; 
            id(ow_sel_z1).publish_state("None"); 
          }
          if (id(idx_z2) == new_idx) { 
            id(idx_z2) = 0; 
            id(ow_sel_z2).publish_state("None"); 
          }

  # --- Virtual Thermostat ZONE 1 SELECT ---
  - platform: template
    name: "DS18x20 Select z1 Sensor"
    id: ow_sel_z1
    optimistic: true
    restore_value: true
    entity_category: config
    options: ["None", "DS18x20 - 0", "DS18x20 - 1", "DS18x20 - 2", "DS18x20 - 3"]
    set_action:
      - lambda: |-
          int new_idx = id(ow_sel_z1).index_of(x).value_or(0);
          id(idx_z1) = new_idx;

          if (new_idx == 0) return;

          if (id(idx_feed) == new_idx) { 
            id(idx_feed) = 0; 
            id(ow_sel_feed).publish_state("None"); 
          }
          if (id(idx_return) == new_idx) { 
            id(idx_return) = 0; 
            id(ow_sel_return).publish_state("None"); 
          }
          if (id(idx_z2) == new_idx) { 
            id(idx_z2) = 0; 
            id(ow_sel_z2).publish_state("None"); 
          }

  # --- Virtual Thermostat ZONE 2 SELECT ---
  - platform: template
    name: "DS18x20 Select z2 Sensor"
    id: ow_sel_z2
    optimistic: true
    restore_value: true
    entity_category: config
    options: ["None", "DS18x20 - 0", "DS18x20 - 1", "DS18x20 - 2", "DS18x20 - 3"]
    set_action:
      - lambda: |-
          int new_idx = id(ow_sel_z2).index_of(x).value_or(0);
          id(idx_z2) = new_idx;

          if (new_idx == 0) return;

          if (id(idx_feed) == new_idx) { 
            id(idx_feed) = 0; 
            id(ow_sel_feed).publish_state("None"); 
          }
          if (id(idx_return) == new_idx) { 
            id(idx_return) = 0; 
            id(ow_sel_return).publish_state("None"); 
          }
          if (id(idx_z1) == new_idx) { 
            id(idx_z1) = 0; 
            id(ow_sel_z1).publish_state("None"); 
          }
