blueprint:
  name: Sync Room Temperature to Ecodan (Sensor Version)
  description: >
    Synchronizes the current temperature from a separate sensor to the Asgard 'Virtual Thermostat' number input.

    It automatically reads the state of the sensor and only updates
    the Ecodan device if the value has changed to prevent unnecessary traffic.

    Only valid readings are forwarded: the value must be a number and within
    the target's own min/max range, so unavailable sensors and bogus readings
    (e.g. a 0 published by an offline device) are ignored.
  domain: automation
  input:
    source_entity:
      name: Source Temperature Sensor
      description: The sensor entity that measures the actual room temperature (e.g., sensor.living_room_temperature).
      selector:
        entity:
          domain: sensor
    
    target_input:
      name: Target feedback (number) field
      description: The ESPHome 'number' entity for the Virtual Thermostat input (e.g., number.ecodan_heatpump_virtual_thermostat_input_z1).
      selector:
        entity:
          domain: number

variables:
  source: !input source_entity
  target: !input target_input

trigger:
  - platform: state
    entity_id: !input source_entity

action:
  - condition: template
    value_template: "{{ is_number(states(source)) }}"
  
  - variables:
      current_temp: "{{ states(source) | float(-999) }}"
      temp_min: state_attr(target, 'min')
      temp_max: state_attr(target, 'max')

  - condition: template
    value_template: >-
      {{ current_temp >= (temp_min if is_number(temp_min) else -50)
         and current_temp <= (temp_max if is_number(temp_max) else 125) }}

  - condition: template
    value_template: "{{ current_temp != states(target) | float(0) }}"

  - service: number.set_value
    target:
      entity_id: !input target_input
    data:
      value: "{{ current_temp }}"
      
  - delay: "00:01:00"

mode: single