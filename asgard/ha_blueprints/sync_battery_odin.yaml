blueprint:
  name: Sync Battery Value to ODIN (REST)
  description: >
    Forwards a numeric sensor value (battery SOC or maximum discharge
    power) to an ODIN device through its REST API, so Home Assistant can
    feed the solver's battery physics without MQTT.


    Only valid readings are forwarded: the value must be a number and
    within the target field's accepted range, and it is only written when
    it differs from what the ODIN currently holds, so the device's flash
    is not written on every sensor update.


    Value units must match the field: SOC in kWh (0..2000), discharge
    limit in kW (0..100).


    One-time setup: add these two generic commands to configuration.yaml
    and restart Home Assistant (they serve every ODIN on the network):


        rest_command:
          odin_get:
            url: "http://{{ host }}/dashboard/state"
            method: GET
          odin_set:
            url: "http://{{ host }}/dashboard/set"
            method: POST
            payload: '{"key": "{{ key }}", "value": {{ value }}}'
            content_type: "application/json"
  domain: automation
  input:
    source_entity:
      name: Source Sensor
      description: >
        The numeric sensor to forward, e.g. a battery energy sensor in kWh
        (for SOC) or a power sensor in kW (for the discharge limit).
      selector:
        entity:
          domain: sensor

    odin_host:
      name: ODIN Address
      description: IP or hostname of the ODIN on the LAN (e.g. 192.168.2.190).
      selector:
        text: {}

    target_field:
      name: ODIN Field
      description: Which battery physics value this sensor feeds.
      default: battery_soc_kwh
      selector:
        select:
          mode: dropdown
          options:
            - battery_soc_kwh
            - battery_max_discharge_kw

variables:
  source: !input source_entity
  host: !input odin_host
  field: !input target_field
  field_range: >-
    {{ {'battery_soc_kwh': [0, 2000],
        'battery_max_discharge_kw': [0, 100]}[field] }}

trigger:
  - platform: state
    entity_id: !input source_entity

condition:
  - condition: template
    value_template: >-
      {% set raw = states(source) | float(-99999) %}
      {% set lo, hi = field_range %}
      {{ is_number(states(source)) and raw >= lo and raw <= hi }}

action:
  - variables:
      value: "{{ states(source) | float(-99999) }}"

  - service: rest_command.odin_get
    response_variable: odin_resp
    continue_on_error: true
    data:
      host: "{{ host }}"

  - condition: template
    value_template: >-
      {% if odin_resp is defined and odin_resp is not none %}
        {% set body = odin_resp['content'] %}
        {% if body is string %}{% set body = body | from_json %}{% endif %}
        {{ value != (body.get(field, -99999) | float(-99999)) }}
      {% else %}{{ true }}{% endif %}

  - service: rest_command.odin_set
    data:
      host: "{{ host }}"
      key: "{{ field }}"
      value: "{{ value }}"

mode: single
max_exceeded: silent
